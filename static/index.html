<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 도슨트봇 - AI Docent Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
  </style>
  <link rel="stylesheet" type="text/css" href="styles/fonts.css">
  <link rel="stylesheet" type="text/css" href="styles/index.css">
  <!--link rel="stylesheet" type="text/css" href="styles/tailwind.css"-->
  <link rel="stylesheet" type="text/css" href="styles/theme.css">
</head>
<body>
  <div class="min-h-screen bg-gradient-to-b from-sky-50 to-blue-50 flex flex-col items-center justify-center p-6">
    <div class="w-full max-w-md space-y-8">
      <!-- Logo -->
      <div class="flex justify-center">
        <div class="bg-white rounded-3xl p-6 shadow-lg">
          <img 
            src="static/assets/robot.png" 
            alt="Docent Bot" 
            class="w-48 h-48 object-contain"
          />
        </div>
      </div>

      <!-- Welcome Message -->
      <div class="text-center mb-8 space-y-2">
        <p class="text-gray-700 px-6 leading-relaxed">
          안녕하세요, 도슨트봇입니다. 작품을 직접 스캔하거나 음성으로 질문해 보세요. 쉽고 재미있는 맞춤형 전시 해설을 들려드립니다.
        </p>
      </div>

      <!-- Action Buttons -->
      <div class="space-y-4">
        <button 
          onclick="location.href='voice_chat_bot.html'"
          class="w-full bg-gradient-to-r from-sky-500 to-blue-500 hover:from-sky-600 hover:to-blue-600 text-white py-8 rounded-2xl shadow-lg hover:shadow-xl transition-all"
        >
          <div class="flex flex-col items-center gap-2">
            <span class="text-xl font-bold">음성 챗봇</span>
            <span class="text-sm opacity-90">Voice Chatbot</span>
          </div>
        </button>

        <button 
          onclick="location.href='ar_docent_bot.html'"
          class="w-full bg-gradient-to-r from-cyan-500 to-sky-500 hover:from-cyan-600 hover:to-sky-600 text-white py-8 rounded-2xl shadow-lg hover:shadow-xl transition-all"
        >
          <div class="flex flex-col items-center gap-2">
            <span class="text-xl font-bold">작품 스캔</span>
            <span class="text-sm opacity-90">Artwork Scan</span>
          </div>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
