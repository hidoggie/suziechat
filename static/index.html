<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B">
  <title>글로벌 AI 도슨트</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0A0A0B; color: #FFFFFF; font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Hiragino Sans', 'PingFang SC', 'Noto Sans CJK', sans-serif; }
    .wrap { min-height: 100vh; min-height: 100dvh; max-width: 480px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; justify-content: center; gap: 28px; }
    .langs { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
    .lang-btn { height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #33333B; background: transparent; color: #E4E4EA; font-family: inherit; font-size: 13px; cursor: pointer; }
    .lang-btn[aria-pressed="true"] { border-color: #1EBD7B; background: #1EBD7B; color: #0A0A0B; font-weight: 700; }
    .logo { align-self: center; width: 148px; height: 148px; border-radius: 50%; background: #F5FB20; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
    .logo img { width: 148px; margin-bottom: -40px; }
    .hello { text-align: center; display: flex; flex-direction: column; gap: 8px; }
    .hello .eyebrow { font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #1EBD7B; }
    .hello h1 { margin: 0; font-weight: 900; letter-spacing: -0.04em; font-size: 26px; }
    .hello p { margin: 0; color: #B4B4BE; font-size: 15px; line-height: 1.6; word-break: keep-all; }
    .go { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 20px; border-radius: 18px; background: #F5FB20; color: #0A0A0B; text-decoration: none; text-align: center; }
    .go b { font-size: 19px; font-weight: 900; letter-spacing: -0.02em; }
    .go span { font-size: 13px; font-weight: 600; opacity: .75; }
  </style>
</head>
<body>
  <div id="bannerSlot"></div>
  <div class="wrap">
    <!-- 언어 선택 -->
    <div id="langRow" class="langs" role="group" aria-label="Language"></div>

    <div class="logo"><img src="static/assets/docent-duck.png" alt="" onerror="this.style.display='none'"></div>

    <div class="hello">
      <span class="eyebrow">SYS-03 · AI DOCENT</span>
      <h1 data-i18n="app_title"></h1>
      <p data-i18n="welcome"></p>
    </div>

    <!-- 작품/간판 스캔(AR 도슨트) 버튼은 이번 행사에서 제외 — 음성·텍스트 도슨트만 제공 -->
    <a id="chatLink" class="go" href="static/voice_chat_bot.html">
      <b data-i18n="btn_chat"></b>
      <span data-i18n="btn_chat_sub"></span>
    </a>
  </div>

  <script src="static/config.js"></script>
  <script src="static/common.js"></script>
  <script>
    const langRow = document.getElementById('langRow');
    function renderLangs() {
      langRow.innerHTML = '';
      App.LANGS.forEach(l => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'lang-btn';
        b.textContent = l.label;
        b.setAttribute('aria-pressed', String(l.code === App.getLang()));
        b.addEventListener('click', () => App.setLang(l.code));
        langRow.appendChild(b);
      });
    }
    function updateLinks() {
      document.getElementById('chatLink').href = App.withLang('static/voice_chat_bot.html');
    }
    App.applyI18n();
    renderLangs();
    updateLinks();
    App.mountInAppBanner(document.getElementById('bannerSlot'));
    window.addEventListener('langchange', () => { renderLangs(); updateLinks(); });
  </script>
</body>
</html>
